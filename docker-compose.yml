services:
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_URL=http://backend:5000/api/v1
      - VITE_WS_URL=ws://backend:5000
    ports:
      - "4173:4173"
    networks:
      - coshop-network
  
   
  backend:
    build:
      context: ./backend
    container_name: coshop-backend
    environment:
     # POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable"
      - POSTGRES_URL=postgres://postgres:root@database:5432/coshop_db?sslmode=disable     
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379      
    ports:
     - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      -  coshop-network
  
  redis:
    image: redis:7-alpine
    container_name: coshop-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coshop-network
 
  database:
    image: postgis/postgis:16-3.4
    container_name: database
    restart: unless-stopped

    environment:
      - POSTGRES_PASSWORD= ${DB_PASSWORD}
      - POSTGRES_USER= ${DB_USER}
      - POSTGRES_DB= ${DB_NAME}
      - POSTGRES_PORT= ${DB_PORT}

    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
     # test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coshop-network

volumes:
  pg-data:

networks:
  coshop-network:
